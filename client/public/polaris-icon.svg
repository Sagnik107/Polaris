<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="polarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#43b8ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#28a9f5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starNorthA" x1="32" y1="6" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7bd0ff"/>
      <stop offset="100%" stop-color="#28a9f5"/>
    </linearGradient>
    <linearGradient id="starNorthB" x1="32" y1="6" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2087cc"/>
      <stop offset="100%" stop-color="#0e436c"/>
    </linearGradient>
    <linearGradient id="starSouthA" x1="32" y1="58" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2087cc"/>
      <stop offset="100%" stop-color="#0e436c"/>
    </linearGradient>
    <linearGradient id="starSouthB" x1="32" y1="58" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7bd0ff"/>
      <stop offset="100%" stop-color="#28a9f5"/>
    </linearGradient>
    <linearGradient id="starEastA" x1="58" y1="32" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7bd0ff"/>
      <stop offset="100%" stop-color="#28a9f5"/>
    </linearGradient>
    <linearGradient id="starEastB" x1="58" y1="32" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2087cc"/>
      <stop offset="100%" stop-color="#0e436c"/>
    </linearGradient>
    <linearGradient id="starWestA" x1="6" y1="32" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2087cc"/>
      <stop offset="100%" stop-color="#0e436c"/>
    </linearGradient>
    <linearGradient id="starWestB" x1="6" y1="32" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7bd0ff"/>
      <stop offset="100%" stop-color="#28a9f5"/>
    </linearGradient>
    <linearGradient id="auroraCore" x1="26" y1="26" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7bd0ff"/>
      <stop offset="80%" stop-color="#31d49a"/>
      <stop offset="100%" stop-color="#188f63"/>
    </linearGradient>
  </defs>

  <!-- Dark Polar Navy Base Roundel -->
  <rect width="64" height="64" rx="14" fill="#020914"/>
  <rect width="64" height="64" rx="14" stroke="#163857" stroke-width="1.5"/>

  <!-- Radial Polar Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#polarGlow)"/>

  <!-- Tactical Radar Range Ring -->
  <circle cx="32" cy="32" r="21" stroke="#28a9f5" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#43b8ff" stroke-opacity="0.2" stroke-width="0.75"/>

  <!-- Precision Cardinal Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#7bd0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="#7bd0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="10" y2="32" stroke="#7bd0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#7bd0ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 4 Secondary Intercardinal Star Rays -->
  <polygon points="32,32 37,27 48,16 39,25" fill="#1b5a88" opacity="0.9"/>
  <polygon points="32,32 39,25 48,16 35,29" fill="#389fd6" opacity="0.9"/>
  <polygon points="32,32 27,27 16,16 25,25" fill="#389fd6" opacity="0.9"/>
  <polygon points="32,32 25,25 16,16 29,29" fill="#1b5a88" opacity="0.9"/>
  <polygon points="32,32 37,37 48,48 39,39" fill="#389fd6" opacity="0.9"/>
  <polygon points="32,32 39,39 48,48 35,35" fill="#1b5a88" opacity="0.9"/>
  <polygon points="32,32 27,37 16,48 25,39" fill="#1b5a88" opacity="0.9"/>
  <polygon points="32,32 25,39 16,48 29,35" fill="#389fd6" opacity="0.9"/>

  <!-- 4 Primary Cardinal Star Rays (Faceted 3D) -->
  <polygon points="32,7 32,32 26.5,32" fill="url(#starNorthA)"/>
  <polygon points="32,7 37.5,32 32,32" fill="url(#starNorthB)"/>
  <polygon points="32,57 32,32 26.5,32" fill="url(#starSouthA)"/>
  <polygon points="32,57 37.5,32 32,32" fill="url(#starSouthB)"/>
  <polygon points="57,32 32,26.5 32,32" fill="url(#starEastA)"/>
  <polygon points="57,32 32,32 32,37.5" fill="url(#starEastB)"/>
  <polygon points="7,32 32,26.5 32,32" fill="url(#starWestA)"/>
  <polygon points="7,32 32,32 32,37.5" fill="url(#starWestB)"/>

  <!-- Central Faceted Diamond Core -->
  <polygon points="32,24 38,32 32,40 26,32" fill="url(#auroraCore)" stroke="#020914" stroke-width="0.75"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
